<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="普瑞赛斯 · 陪伴">
  <defs>
    <!-- 底板：深蓝黑的圆角方块。加底板是为了在任何底色上都读得出来——
         插件的图标会出现在插件管理页的列表里，那里可能是浅色主题。 -->
    <linearGradient id="pc-bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#111834"/>
      <stop offset="1" stop-color="#080b18"/>
    </linearGradient>
    <!-- 菱形：她的瞳孔。亮紫到深紫。 -->
    <linearGradient id="pc-diamond" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#cfaeff"/>
      <stop offset="0.55" stop-color="#9a6bf0"/>
      <stop offset="1" stop-color="#5c33c4"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#pc-bg)"/>
  <rect x="1.7" y="1.7" width="60.6" height="60.6" rx="14.3" fill="none"
        stroke="#8fb0ff" stroke-opacity="0.20" stroke-width="1.4"/>

  <!-- 故障分色：左右各偏移一点的菱形描边，暗示她那身冷光与色偏 -->
  <path d="M32 12.5 51.5 32 32 51.5 12.5 32Z" fill="none"
        stroke="#ff2d6e" stroke-opacity="0.55" stroke-width="1.6" transform="translate(1.8 0)"/>
  <path d="M32 12.5 51.5 32 32 51.5 12.5 32Z" fill="none"
        stroke="#00dcff" stroke-opacity="0.55" stroke-width="1.6" transform="translate(-1.8 0)"/>

  <!-- 主体菱形 -->
  <path d="M32 14 50 32 32 50 14 32Z" fill="url(#pc-diamond)"/>
  <!-- 上缘高光：让它看起来是个有厚度的晶体，而不是一块平色 -->
  <path d="M32 14 50 32 32 32 14 32Z" fill="#ffffff" fill-opacity="0.16"/>
  <!-- 竖瞳：菱形中间的竖缝，她的眼睛 -->
  <ellipse cx="32" cy="32" rx="2.6" ry="9.5" fill="#120a22" fill-opacity="0.92"/>
  <ellipse cx="32" cy="32" rx="1.1" ry="5" fill="#f2e8ff" fill-opacity="0.72"/>
  <!-- 一点星屑 -->
  <circle cx="44.5" cy="19.5" r="1.5" fill="#e9f3ff" fill-opacity="0.9"/>
  <circle cx="20" cy="45" r="1" fill="#cfe2ff" fill-opacity="0.65"/>
</svg>
